# Local stack:  docker compose up --build   → http://localhost:8081
# Dev loop:     docker compose up -d db     → run backend with -Dspring-boot.run.profiles=local, `npm start` in frontend
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: fieldops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops -d fieldops"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/fieldops
      DB_USER: fieldops
      DB_PASSWORD: fieldops
      # Local only. Generate a real one with: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtcHJvZHVjdGlvbi0xMjM0NTY=}
      CORS_ORIGINS: http://localhost:8081,http://localhost:4200
      SERVER_FORWARD_HEADERS_STRATEGY: native
      STORAGE_LOCAL_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
  uploads:
