<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cleaning supplies in a bright living room">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef6f7"/>
      <stop offset=".72" stop-color="#d9ebee"/>
      <stop offset="1" stop-color="#c3dde2"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3f1f3"/>
    </linearGradient>
    <linearGradient id="bucket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a5f67"/>
      <stop offset=".45" stop-color="#11808a"/>
      <stop offset="1" stop-color="#0a5f67"/>
    </linearGradient>
    <linearGradient id="teal-bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a9aa2"/>
      <stop offset=".5" stop-color="#3fc0c6"/>
      <stop offset="1" stop-color="#1a9aa2"/>
    </linearGradient>
    <linearGradient id="clear-bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6f3f5"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e9ec"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c9cf"/>
      <stop offset="1" stop-color="#9fb2b9"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".25" r=".7">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- room -->
  <rect width="900" height="700" fill="url(#room)"/>
  <!-- window -->
  <g opacity=".95">
    <rect x="40" y="40" width="330" height="390" rx="6" fill="url(#win)"/>
    <rect x="40" y="40" width="330" height="390" rx="6" fill="none" stroke="#cfe2e6" stroke-width="10"/>
    <line x1="205" y1="40" x2="205" y2="430" stroke="#cfe2e6" stroke-width="8"/>
    <line x1="40" y1="225" x2="370" y2="225" stroke="#cfe2e6" stroke-width="8"/>
  </g>
  <rect width="900" height="700" fill="url(#glow)"/>
  <!-- floor -->
  <path d="M0 520 H900 V700 H0 Z" fill="#c9dfe3"/>
  <path d="M0 520 H900" stroke="#b4d0d5" stroke-width="3"/>

  <!-- plant (back right) -->
  <g>
    <path d="M700 520 l12-110 h76 l12 110 z" fill="#e8eef0"/>
    <path d="M712 410 h76" stroke="#d4dfe2" stroke-width="6"/>
    <g fill="#3f9b6b">
      <path d="M750 410 C700 340 650 330 610 300 C680 300 730 340 750 410 Z"/>
      <path d="M750 410 C760 330 740 260 760 190 C800 260 780 340 750 410 Z" fill="#358a5e"/>
      <path d="M750 410 C800 350 860 330 890 290 C860 360 800 390 750 410 Z"/>
      <path d="M750 410 C720 330 690 270 700 210 C740 270 750 340 750 410 Z" fill="#4aa978"/>
      <path d="M750 410 C790 320 830 280 860 230 C850 310 800 370 750 410 Z" fill="#358a5e"/>
    </g>
  </g>

  <!-- sofa (back) -->
  <g>
    <rect x="380" y="330" width="330" height="120" rx="34" fill="url(#sofa)"/>
    <rect x="360" y="400" width="370" height="110" rx="30" fill="#aebfc5"/>
    <rect x="345" y="385" width="56" height="130" rx="26" fill="#b6c6cc"/>
    <rect x="690" y="385" width="56" height="130" rx="26" fill="#b6c6cc"/>
    <rect x="420" y="352" width="120" height="90" rx="22" fill="#d9e6e9" transform="rotate(-8 480 397)"/>
    <rect x="560" y="356" width="110" height="86" rx="22" fill="#1a9aa2" transform="rotate(6 615 399)"/>
    <rect x="380" y="512" width="12" height="18" rx="3" fill="#8aa0a7"/>
    <rect x="700" y="512" width="12" height="18" rx="3" fill="#8aa0a7"/>
  </g>

  <!-- small plant on the floor (left) -->
  <g>
    <path d="M40 600 l8-62 h60 l8 62 z" fill="#e8eef0"/>
    <g fill="#4aa978">
      <path d="M78 540 C50 500 30 495 10 480 C45 480 70 505 78 540 Z"/>
      <path d="M78 540 C82 495 75 465 88 430 C105 470 95 505 78 540 Z" fill="#358a5e"/>
      <path d="M78 540 C105 505 130 495 150 478 C135 515 105 530 78 540 Z"/>
    </g>
  </g>

  <!-- shadow under the bucket -->
  <ellipse cx="330" cy="668" rx="230" ry="22" fill="#0f2a3d" opacity=".12"/>

  <!-- bucket handle (behind the bottles) -->
  <path d="M146 452 C146 318 514 318 514 452" fill="none" stroke="#0a5f67" stroke-width="9" stroke-linecap="round"/>

  <!-- bottles standing in the bucket -->
  <!-- tall teal spray bottle -->
  <g>
    <path d="M300 300 h52 l10 26 v150 h-72 v-150 z" fill="url(#teal-bottle)"/>
    <rect x="312" y="262" width="34" height="40" rx="6" fill="#0b7a83"/>
    <path d="M300 236 h70 l26 18 -8 12 -24 -8 h-14 v8 h-50 z" fill="#0a5f67"/>
    <path d="M350 264 q10 20 0 44 l-12 -3 q8 -18 0 -38 z" fill="#0a5f67"/>
    <rect x="306" y="350" width="40" height="70" rx="8" fill="#ffffff" opacity=".85"/>
    <rect x="314" y="364" width="24" height="5" rx="2.5" fill="#1a9aa2"/>
    <rect x="314" y="376" width="18" height="5" rx="2.5" fill="#9fd6da"/>
  </g>
  <!-- clear spray bottle with teal trigger -->
  <g>
    <path d="M190 330 h46 l12 30 v120 h-70 v-120 z" fill="url(#clear-bottle)"/>
    <path d="M182 360 h66 v120 h-70 z" fill="#bfe6ea" opacity=".55"/>
    <rect x="198" y="296" width="30" height="36" rx="6" fill="#ffffff"/>
    <path d="M190 274 h62 l22 16 -7 11 -22 -7 h-10 v6 h-45 z" fill="#2bb3ba"/>
    <path d="M238 300 q9 18 0 40 l-11 -3 q7 -16 0 -34 z" fill="#2bb3ba"/>
  </g>
  <!-- scrub brush -->
  <g transform="rotate(-24 455 380)">
    <rect x="395" y="360" width="120" height="34" rx="12" fill="#1f3a4a"/>
    <rect x="402" y="392" width="106" height="16" rx="4" fill="#3fc0c6"/>
    <g stroke="#2a8f97" stroke-width="3">
      <line x1="412" y1="408" x2="412" y2="420"/><line x1="426" y1="408" x2="426" y2="420"/>
      <line x1="440" y1="408" x2="440" y2="420"/><line x1="454" y1="408" x2="454" y2="420"/>
      <line x1="468" y1="408" x2="468" y2="420"/><line x1="482" y1="408" x2="482" y2="420"/>
      <line x1="496" y1="408" x2="496" y2="420"/>
    </g>
  </g>

  <!-- bucket -->
  <g>
    <path d="M140 450 h380 l-30 210 h-320 z" fill="url(#bucket)"/>
    <rect x="128" y="434" width="404" height="34" rx="14" fill="#0b6f78"/>
    <rect x="128" y="434" width="404" height="12" rx="6" fill="#178c96"/>
    <path d="M168 520 h324" stroke="#0a5a61" stroke-width="5" opacity=".6"/>
    <path d="M176 600 h308" stroke="#0a5a61" stroke-width="5" opacity=".6"/>
  </g>

  <!-- cloth over the rim -->
  <g>
    <path d="M250 430 C290 426 330 430 360 436 L372 612 C340 620 296 618 262 610 Z" fill="#7fcbe0"/>
    <path d="M250 430 C290 426 330 430 360 436 L362 470 C330 462 290 460 252 466 Z" fill="#a6dcea"/>
    <g stroke="#69bad1" stroke-width="3" opacity=".8">
      <line x1="270" y1="490" x2="268" y2="600"/><line x1="292" y1="488" x2="292" y2="606"/>
      <line x1="314" y1="488" x2="316" y2="608"/><line x1="338" y1="490" x2="342" y2="608"/>
    </g>
    <path d="M262 610 C296 618 340 620 372 612 L376 626 C340 634 296 632 258 624 Z" fill="#69bad1"/>
  </g>

  <!-- sparkles -->
  <g fill="#f0a92e">
    <path d="M560 250c3 13 8 18 21 21-13 3-18 8-21 21-3-13-8-18-21-21 13-3 18-8 21-21z"/>
    <path d="M120 300c2 9 5 12 14 14-9 2-12 5-14 14-2-9-5-12-14-14 9-2 12-5 14-14z" opacity=".9"/>
  </g>
  <g fill="#ffffff">
    <path d="M410 470c2 8 5 11 13 13-8 2-11 5-13 13-2-8-5-11-13-13 8-2 11-5 13-13z"/>
    <path d="M610 300c1.5 6 4 8.5 10 10-6 1.5-8.5 4-10 10-1.5-6-4-8.5-10-10 6-1.5 8.5-4 10-10z"/>
  </g>
</svg>
