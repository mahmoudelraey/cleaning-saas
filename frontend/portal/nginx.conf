server {
  listen 80;
  root /usr/share/nginx/html;

  # API goes to the portal backend (never to the admin backend's /internal/**).
  location /api/ {
    proxy_pass http://portal-backend:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Built files have a hash in their name, so they can be cached for good.
  location ~* \.(js|css|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Translations and the page itself keep the same name between deploys: the browser must check for a new copy
  # every time (a quick 304 when nothing changed), or it keeps showing the old texts after a deploy.
  location /i18n/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
