name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # core + admin/backend + portal/backend in one Maven reactor (root pom.xml).
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests + integration tests (Testcontainers uses the runner's Docker).
      - run: mvn -B verify

  admin-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin/frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  portal-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
