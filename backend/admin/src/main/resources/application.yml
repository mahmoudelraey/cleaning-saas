spring:
  application:
    name: fieldops
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fieldops}
    username: ${DB_USER:fieldops}
    password: ${DB_PASSWORD:fieldops}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

logging:
  level:
    com.fieldops: ${LOG_LEVEL:DEBUG}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # Encrypts secrets saved in Platform → Messaging. Base64 of 32 random bytes; same value on admin and portal.
  settings:
    encryption-key: ${SETTINGS_ENCRYPTION_KEY:ZGV2LW9ubHktc2V0dGluZ3Mta2V5LWNoYW5nZS1tZSE=}
  # The FieldOps owner's console account, created at startup when no platform admin exists yet.
  platform:
    admin:
      name: ${PLATFORM_ADMIN_NAME:FieldOps Admin}
      phone: ${PLATFORM_ADMIN_PHONE:0551234567}
      email: ${PLATFORM_ADMIN_EMAIL:}
      password: ${PLATFORM_ADMIN_PASSWORD:Field@Ops2026}
  plans:
    # Automatic customer messages per month on plans with "whatsapp_limited" (Basic). OTP codes don't count.
    limited-whatsapp-monthly: ${LIMITED_WHATSAPP_MONTHLY:100}
  # Where customers open shared links (invoice/quote pages, booking page). The Angular app's origin.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
  security:
    jwt:
      # Base64-encoded key, at least 32 bytes. The default is a DEV-ONLY key for localhost; set JWT_SECRET in
      # every real environment (DevDefaultsGuard refuses to start with it when PUBLIC_BASE_URL is not localhost).
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtcHJvZHVjdGlvbi0xMjM0NTY=}
      issuer: fieldops
      access-ttl: 15m
      refresh-ttl: 30d
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  db:
    # Role the app switches to inside each transaction so PostgreSQL Row Level Security applies
    # even when the login user owns the tables or is a superuser (local Docker, Testcontainers).
    rls-role: fieldops_app
  rate-limit:
    # Requests per IP per minute on /api/v1/auth/** and /api/v1/public/**
    public-per-minute: 30
  # Trial length and plan for new signups: Platform → Settings (platform_settings).
  otp:
    # Returns the booking-page verification code in the API response, so local dev works without SMS/WhatsApp.
    # Must be false in production: set OTP_EXPOSE_CODE=false (DevDefaultsGuard enforces it off localhost).
    expose-code: ${OTP_EXPOSE_CODE:true}
  storage:
    # local | s3
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:me-central-1}
      bucket: ${S3_BUCKET:fieldops}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  default-timezone: Asia/Riyadh
  google:
    # Google Places API (New) key: company search in admin, live Google rating/reviews on the portal page.
    # Empty = the Google section is hidden. Restrict the key to the Places API (New) in Google Cloud.
    places-api-key: ${GOOGLE_PLACES_API_KEY:}
  jobs:
    # Background jobs (notification dispatch, reminders). One instance runs them at a time (ShedLock).
    enabled: ${JOBS_ENABLED:true}
  notifications:
    # Without credentials every message goes to the log channel (development).
    whatsapp:
      enabled: ${WHATSAPP_ENABLED:false}
      access-token: ${WHATSAPP_TOKEN:}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      app-secret: ${WHATSAPP_APP_SECRET:}
      verify-token: ${WHATSAPP_VERIFY_TOKEN:}
      language: ar
      # Map each message to its approved template name in Meta Business Manager.
      templates:
        BOOKING_RECEIVED: booking_received
        BOOKING_CONFIRMED: booking_confirmed
        BOOKING_RESCHEDULED: booking_rescheduled
        BOOKING_REMINDER: booking_reminder
        TECHNICIAN_ON_THE_WAY: technician_on_the_way
        VISIT_COMPLETED: visit_completed
        BOOKING_CANCELLED: booking_cancelled
        INVOICE_ISSUED: invoice_issued
        QUOTE_SENT: quote_sent
        OTP: otp_code
    sms:
      enabled: ${SMS_ENABLED:false}
      app-sid: ${UNIFONIC_APP_SID:}
      sender-id: ${UNIFONIC_SENDER_ID:}
